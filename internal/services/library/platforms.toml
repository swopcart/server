# Game Library Platforms Configuration
#
# This file defines the gaming platforms available in swopcart.
# Admins can modify extensions per platform to customize file detection.
#
# Format:
# [[platforms]]
# name = "Platform Name"
# description = "Description of the platform"
# extensions = [".ext1", ".ext2", ".zip"]

[[platforms]]
name = "NES"
description = "Nintendo Entertainment System"
extensions = [".nes", ".rom", ".zip"]

[[platforms]]
name = "SNES"
description = "Super Nintendo Entertainment System"
extensions = [".sfc", ".smc", ".rom", ".zip"]

